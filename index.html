<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a56a8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dando Catalogue">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Dando Wholesale Catalogue</title>

<style>
  :root { --accent: #d62828; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #22252b; font-family: Arial, Helvetica, sans-serif; overflow: hidden; }

  /* ===== BUTTONS EMBEDDED ON THE BOOK ITSELF =====
     This overlay is NOT fixed to the browser viewport — it is synced in
     JS to the exact on-screen rectangle of #book, so the buttons sit
     right on top of the open book (like the printed "SHOP NOW" graphic
     used to) and move/scale with it as the book resizes, instead of
     floating in a separate toolbar above the page. */
  #book-overlay {
    position: absolute; top: 0; left: 0; width: 0; height: 0;
    pointer-events: none; z-index: 500;
  }
  #book-overlay .ov-btn {
    position: absolute; top: 10px;
    pointer-events: auto;
    font-weight: 700; letter-spacing: .5px;
    border-radius: 30px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.45);
    transition: transform .15s, background .15s;
    white-space: nowrap;
  }
  #shop-now {
    right: 10px;
    background: var(--accent); color: #fff; text-decoration: none;
    border: none; font-size: 14px; padding: 10px 22px;
    display: inline-block;
  }
  #shop-now:hover { transform: scale(1.06); background: #b71f1f; }

  /* ===== FLIPBOOK AREA ===== */
  #stage { position: absolute; inset: 16px 0 70px 0; display: flex; align-items: center; justify-content: center; }
  #book { position: relative; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  .page { position: relative; width: 100%; height: 100%; background: #fff; overflow: hidden; }
  .page img { width: 100%; height: 100%; display: block; pointer-events: none; -webkit-user-drag: none; }

  /* ===== CONTROLS ===== */
  #controls {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 14px; align-items: center; z-index: 9000;
    background: rgba(0,0,0,.55); padding: 8px 16px; border-radius: 30px; color: #fff; font-size: 14px;
    width: max-content; white-space: nowrap;
  }
  #indicator { min-width: 52px; text-align: center; }
  #controls button {
    background: #fff; color: #222; border: 0; width: 36px; height: 36px;
    border-radius: 50%; font-size: 18px; cursor: pointer;
  }
  #controls button:hover { background: #ddd; }
  #controls button svg { display: block; margin: auto; }

  /* ===== ZOOM (lets phone users enlarge the page) ===== */
  #book { transform-origin: 50% 50%; }
  #zoom-layer {
    position: fixed; inset: 0; z-index: 8000; display: none;
    touch-action: none; cursor: grab; -webkit-user-select: none; user-select: none;
  }
  #zoom-layer:active { cursor: grabbing; }
  body.zoomed #zoom-layer { display: block; }
  body.zoomed #book-overlay { display: none; }
  /* clip the enlarged page to the viewing area so it can't stretch the page layout */
  body.zoomed #stage { overflow: hidden; }

  /* ===== LOADER ===== */
  #loader {
    position: fixed; inset: 0; z-index: 9500; background: #22252b; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  }
  #loader-logo {
    width: 160px; height: auto; margin-bottom: 4px;
    animation: loader-bounce 1.4s ease-in-out infinite;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,.5));
  }
  @keyframes loader-bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  #bar-wrap { width: 240px; height: 6px; background: #444; border-radius: 3px; overflow: hidden; }
  #bar { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #error { color: #ff8a8a; max-width: 80%; text-align: center; display: none; }
</style>
</head>
<body>

<div id="loader">
  <img id="loader-logo" src="assets/dandodo-logo.png" alt="Dan-Do">
  <div id="loader-text">Loading catalogue…</div>
  <div id="bar-wrap"><div id="bar"></div></div>
  <div id="error"></div>
</div>

<div id="stage">
  <div id="book"></div>
  <div id="book-overlay">
    <a id="shop-now" class="ov-btn" href="https://www.dandowholesale.com" target="_blank" rel="noopener noreferrer">Shop Now</a>
  </div>
</div>

<div id="zoom-layer"></div>

<div id="controls">
  <button id="prev" aria-label="Previous page">&#8249;</button>
  <span id="indicator">1 / 1</span>
  <button id="next" aria-label="Next page">&#8250;</button>
  <button id="zoom-btn" type="button" aria-label="Zoom in" title="Zoom in"></button>
</div>

<script src="vendor/page-flip.js"></script>

<script>
  const TOTAL_PAGES = 35;
  const PAGE_URL = (lang, i) => "pages/" + lang + "/page-" + String(i).padStart(2, "0") + ".jpg";
  const PAGE_W = 1400, PAGE_H = 1812; // native render size of every page image

  const loader = document.getElementById("loader");
  const loaderText = document.getElementById("loader-text");
  const errBox = document.getElementById("error");
  const bar = document.getElementById("bar");
  const indicator = document.getElementById("indicator");
  const book = document.getElementById("book");
  const bookOverlay = document.getElementById("book-overlay");
  const stageEl = document.getElementById("stage");

  let lang = "en"; // current language: "en" or "fr"
  let flip = null;

  // Keeps the button overlay locked to the book's on-screen rectangle so
  // the buttons stay visually "on" the page instead of floating above it.
  function syncOverlayToBook() {
    const stageRect = stageEl.getBoundingClientRect();
    const bookRect = book.getBoundingClientRect();
    bookOverlay.style.left = (bookRect.left - stageRect.left) + "px";
    bookOverlay.style.top = (bookRect.top - stageRect.top) + "px";
    bookOverlay.style.width = bookRect.width + "px";
    bookOverlay.style.height = bookRect.height + "px";
  }

  function showError(msg) {
    errBox.style.display = "block";
    errBox.textContent = msg;
  }

  function preload(url) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve();
      img.onerror = () => reject(new Error("Failed to load " + url));
      img.src = url;
    });
  }

  function buildPage(i) {
    const div = document.createElement("div");
    div.className = "page";
    if (i === 1 || i === TOTAL_PAGES) div.dataset.density = "hard";

    const img = document.createElement("img");
    img.src = PAGE_URL(lang, i);
    img.alt = "Page " + i;
    img.draggable = false;
    img.dataset.pageIndex = i;
    div.appendChild(img);

    return div;
  }

  async function init() {
    loaderText.textContent = "Loading catalogue…";
    for (let i = 1; i <= TOTAL_PAGES; i++) {
      await preload(PAGE_URL(lang, i));
      book.appendChild(buildPage(i));
      bar.style.width = Math.round((i / TOTAL_PAGES) * 100) + "%";
    }

    const isMobile = window.innerWidth < 700;
    const stage = document.getElementById("stage");
    const availW = stage.clientWidth;
    const availH = stage.clientHeight;
    const ratio = PAGE_W / PAGE_H;

    let pw = Math.min(availH * ratio, (isMobile ? availW : availW / 2));
    let ph = pw / ratio;

    flip = new St.PageFlip(book, {
      width: Math.round(pw),
      height: Math.round(ph),
      size: "fixed",
      showCover: true,
      usePortrait: isMobile,
      maxShadowOpacity: 0.5,
      drawShadow: true,
      flippingTime: 800,
      mobileScrollSupport: false,
      useMouseEvents: true,
      clickEventForward: true,
      showPageCorners: false
    });

    flip.loadFromHTML(document.querySelectorAll("#book .page"));

    const update = () => {
      indicator.textContent = (flip.getCurrentPageIndex() + 1) + " / " + TOTAL_PAGES;
    };
    flip.on("flip", update);
    update();

    document.getElementById("prev").onclick = () => flip.flipPrev();
    document.getElementById("next").onclick = () => flip.flipNext();
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft") flip.flipPrev();
      if (e.key === "ArrowRight") flip.flipNext();
    });

    syncOverlayToBook();
    window.addEventListener("resize", () => { if (zs > 1) applyZoom(); else syncOverlayToBook(); });

    // Restore the page the reader was on if the screen was rotated.
    try {
      const saved = parseInt(sessionStorage.getItem("dando-page"), 10);
      sessionStorage.removeItem("dando-page");
      if (saved > 0) flip.turnToPage(saved);
    } catch (e) {}

    loader.style.display = "none";
  }

  // Keep the Shop Now button from triggering the flip library's drag / hover
  // "page corner peek" behaviour: the library listens for mousedown/touchstart
  // and mousemove/touchmove on the whole window, so stop them at the button.
  ["mousedown", "touchstart", "pointerdown", "mousemove", "touchmove", "pointermove"].forEach(evt => {
    document.getElementById("shop-now").addEventListener(evt, e => e.stopPropagation());
  });


  // ===== ZOOM =====
  // The catalogue pages are portrait (about 3:4) while phones are much
  // taller and narrower, so on a phone the page is already as wide as the
  // screen allows. Zoom lets the reader enlarge it to fill the screen:
  // pinch with two fingers, double-tap, or use the magnifier button; drag
  // to move around while zoomed. Tap the button again to go back.
  const zoomBtn = document.getElementById("zoom-btn");
  const zoomLayer = document.getElementById("zoom-layer");
  const ICON_PLUS = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M10.5 7.5v6M7.5 10.5h6"/></svg>';
  const ICON_MINUS = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M7.5 10.5h6"/></svg>';
  const ZOOM_MAX = 4, ZOOM_START = 2.2;
  let zs = 1, ztx = 0, zty = 0;

  function applyZoom() {
    const sr = stageEl.getBoundingClientRect();
    const maxX = Math.max(0, (book.offsetWidth * zs - sr.width) / 2);
    const maxY = Math.max(0, (book.offsetHeight * zs - sr.height) / 2);
    ztx = Math.min(maxX, Math.max(-maxX, ztx));
    zty = Math.min(maxY, Math.max(-maxY, zty));
    const zoomed = zs > 1.001;
    if (!zoomed) { zs = 1; ztx = 0; zty = 0; }
    book.style.transform = zoomed ? "translate(" + ztx + "px," + zty + "px) scale(" + zs + ")" : "";
    document.body.classList.toggle("zoomed", zoomed);
    zoomBtn.innerHTML = zoomed ? ICON_MINUS : ICON_PLUS;
    zoomBtn.setAttribute("aria-label", zoomed ? "Reset zoom" : "Zoom in");
    zoomBtn.title = zoomed ? "Reset zoom" : "Zoom in";
    if (!zoomed) syncOverlayToBook();
  }

  // Zoom to a new scale while keeping the screen point (mx, my) fixed.
  function zoomAbout(newScale, mx, my) {
    newScale = Math.min(ZOOM_MAX, Math.max(1, newScale));
    const sr = stageEl.getBoundingClientRect();
    const cx = sr.left + sr.width / 2, cy = sr.top + sr.height / 2;
    const k = newScale / zs;
    ztx = (mx - cx) - ((mx - cx) - ztx) * k;
    zty = (my - cy) - ((my - cy) - zty) * k;
    zs = newScale;
    applyZoom();
  }

  function toggleZoom(mx, my) {
    if (zs > 1.001) { zs = 1; applyZoom(); return; }
    const sr = stageEl.getBoundingClientRect();
    zoomAbout(ZOOM_START, mx == null ? sr.left + sr.width / 2 : mx, my == null ? sr.top + sr.height / 2 : my);
  }

  zoomBtn.innerHTML = ICON_PLUS;
  zoomBtn.addEventListener("click", () => toggleZoom());
  stageEl.addEventListener("dblclick", e => { if (zs === 1) toggleZoom(e.clientX, e.clientY); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && zs > 1) { zs = 1; applyZoom(); } });

  const ptrs = new Map();
  let tapStart = null, lastTap = 0;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  zoomLayer.addEventListener("pointerdown", e => {
    zoomLayer.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    tapStart = ptrs.size === 1 ? { x: e.clientX, y: e.clientY, t: Date.now() } : null;
  });
  zoomLayer.addEventListener("pointermove", e => {
    const prev = ptrs.get(e.pointerId);
    if (!prev) return;
    const cur = { x: e.clientX, y: e.clientY };
    if (ptrs.size === 1) {
      ztx += cur.x - prev.x; zty += cur.y - prev.y;
      ptrs.set(e.pointerId, cur);
      applyZoom();
    } else if (ptrs.size === 2) {
      const other = [...ptrs.entries()].find(([id]) => id !== e.pointerId)[1];
      const d0 = dist(prev, other), d1 = dist(cur, other);
      const m0 = { x: (prev.x + other.x) / 2, y: (prev.y + other.y) / 2 };
      const m1 = { x: (cur.x + other.x) / 2, y: (cur.y + other.y) / 2 };
      ptrs.set(e.pointerId, cur);
      ztx += m1.x - m0.x; zty += m1.y - m0.y;
      if (d0 > 0) zoomAbout(zs * d1 / d0, m1.x, m1.y); else applyZoom();
    }
  });
  const endPtr = e => {
    const had = ptrs.delete(e.pointerId);
    // double-tap while zoomed = back to normal size
    if (had && tapStart && ptrs.size === 0 &&
        Date.now() - tapStart.t < 250 && Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y) < 8) {
      if (Date.now() - lastTap < 350) { zs = 1; applyZoom(); lastTap = 0; }
      else lastTap = Date.now();
    }
  };
  zoomLayer.addEventListener("pointerup", endPtr);
  zoomLayer.addEventListener("pointercancel", endPtr);
  zoomLayer.addEventListener("wheel", e => {
    e.preventDefault();
    zoomAbout(zs * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY);
  }, { passive: false });

  // The book is sized once at load, so if a phone is rotated (or the window
  // is resized a lot) reload at the new size, keeping the current page.
  let lastW = window.innerWidth, lastH = window.innerHeight, rt = null;
  window.addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      const w = window.innerWidth, h = window.innerHeight;
      const rotated = (w > h) !== (lastW > lastH);
      if (rotated || Math.abs(w - lastW) > 150) {
        try { if (flip) sessionStorage.setItem("dando-page", String(flip.getCurrentPageIndex())); } catch (e) {}
        location.reload();
      }
      lastW = w; lastH = h;
    }, 500);
  });

  init().catch(err => {
    console.error(err);
    showError("Could not load the catalogue pages. Please refresh the page.");
  });
</script>
</body>
</html>
